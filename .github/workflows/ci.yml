name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: pytest (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install protocol module
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run tests
        run: pytest tests/ -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check clawtouch_hid_protocol firmware tests

  # Firmware can't be unit-tested in CI (needs real Pico hardware) — but we
  # can at least verify it imports cleanly under CPython 3.13 to catch
  # syntax errors. Note: firmware uses CircuitPython 10.x at runtime,
  # which has slightly different stdlib semantics; treat this check as
  # a smoke test, not a guarantee.
  firmware-syntax:
    name: firmware syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: py_compile firmware files
        run: |
          python -m py_compile firmware/boot.py firmware/packet_parser.py
          # firmware/code.py imports usb_hid / usb_cdc which only exist on
          # CircuitPython, so we can only syntax-check it via ast.parse:
          python -c "import ast; ast.parse(open('firmware/code.py').read())"
