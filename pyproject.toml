[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clawtouch-hid-protocol"
version = "1.1.1"
description = "Python definitions for the ClawTouch HID v1.1 wire protocol (additive over v1.0 frozen baseline) — USB CDC frames spoken by ClawTouch Pico firmware. Includes the v1.1 MOUSE_BUTTON_DOWN/UP opcodes for drag gestures."
readme = "README.md"
# PEP 639: SPDX expression form (setuptools >= 77). Avoid the deprecated
# `license = { text = "MIT" }` table form and the legacy
# `License :: OSI Approved :: MIT License` classifier.
# Note: `firmware/lib/adafruit_hid/LICENSE` (bundled Adafruit MIT library)
# is NOT included in `license-files` because the firmware tree is excluded
# from the PyPI sdist/wheel (see [tool.setuptools.packages.find] below); the
# bundled LICENSE is shipped with the GitHub source tree only.
license = "MIT"
license-files = ["LICENSE", "LICENSE.zh-CN.md", "NOTICE", "TRADEMARKS.md"]
authors = [
    { name = "Tinqiao Technology", email = "support@tinqiao.com" },
]
requires-python = ">=3.10"
dependencies = []
keywords = ["clawtouch", "hid", "protocol", "circuitpython", "rp2350", "pico", "usb-cdc"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
    "Topic :: System :: Hardware :: Hardware Drivers",
]

[project.urls]
Homepage = "https://clawtouch.cn"
Source = "https://github.com/tinqiao-oss/clawtouch-hid"
Issues = "https://github.com/tinqiao-oss/clawtouch-hid/issues"
Changelog = "https://github.com/tinqiao-oss/clawtouch-hid/blob/master/CHANGELOG.md"
Documentation = "https://github.com/tinqiao-oss/clawtouch-hid/blob/master/docs/protocol-v1.md"

[tool.setuptools.packages.find]
include = ["clawtouch_hid_protocol*"]
exclude = ["firmware*", "examples*", "docs*", "tests*"]
