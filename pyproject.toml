[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clawtouch-hid-protocol"
version = "1.0.0"
description = "Python definitions for the ClawTouch HID v1.0 wire protocol (USB CDC frames spoken by ClawTouch Pico firmware)."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Tinqiao Technology", email = "support@tinqiao.com" },
]
requires-python = ">=3.10"
dependencies = []
keywords = ["clawtouch", "hid", "protocol", "circuitpython", "rp2350", "pico", "usb-cdc"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
    "Topic :: System :: Hardware :: Hardware Drivers",
]

[project.urls]
Homepage = "https://clawtouch.cn"
Source = "https://github.com/tinqiao-oss/clawtouch-hid"
Issues = "https://github.com/tinqiao-oss/clawtouch-hid/issues"

[tool.setuptools.packages.find]
include = ["clawtouch_hid_protocol*"]
exclude = ["firmware*", "examples*", "docs*"]
