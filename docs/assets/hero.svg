<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">clawtouch-hid signal flow and v1.0 frame layout</title>
  <desc id="desc">Any host program (clawtouch-mcp, a Python script using clawtouch-hid-protocol, or any custom bridge) sends framed bytes over USB-CDC to a Raspberry Pi Pico 2 running the ClawTouch HID firmware in this repository. The firmware parses each frame, validates the checksum, and emits the corresponding USB HID report (keyboard or mouse) to the target operating system. The diagram also shows the frozen v1.0 wire frame layout: 0xAA preamble, seq u16, cmd u8, plen u16, payload, csum u8.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Host program -->
  <g>
    <rect x="20" y="60" width="180" height="110" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
    <text x="110" y="98" text-anchor="middle" font-size="17" font-weight="700" fill="#312e81">Host program</text>
    <text x="110" y="125" text-anchor="middle" font-size="11" fill="#3730a3">clawtouch-mcp /</text>
    <text x="110" y="141" text-anchor="middle" font-size="11" fill="#3730a3">Python bridge /</text>
    <text x="110" y="157" text-anchor="middle" font-size="11" fill="#3730a3">your own client</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="205" y1="115" x2="255" y2="115" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="230" y="103" text-anchor="middle" font-size="10" fill="#475569">USB-CDC</text>
  <text x="230" y="130" text-anchor="middle" font-size="10" fill="#475569">115200 baud</text>

  <!-- Pico 2 + firmware (highlighted, "this repo") -->
  <g>
    <rect x="260" y="50" width="220" height="130" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="370" y="86" text-anchor="middle" font-size="17" font-weight="700" fill="#78350f">Pico 2 + firmware</text>
    <text x="370" y="106" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">▼  this repo  ▼</text>
    <text x="370" y="130" text-anchor="middle" font-size="11" fill="#78350f">CircuitPython 10.x</text>
    <text x="370" y="146" text-anchor="middle" font-size="11" fill="#78350f">frame parser + HID</text>
    <text x="370" y="162" text-anchor="middle" font-size="11" fill="#78350f">composite USB device</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="485" y1="115" x2="535" y2="115" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="103" text-anchor="middle" font-size="10" fill="#475569">USB HID</text>
  <text x="510" y="130" text-anchor="middle" font-size="10" fill="#475569">reports</text>

  <!-- Target OS -->
  <g>
    <rect x="540" y="60" width="150" height="110" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="615" y="98" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">Target OS</text>
    <text x="615" y="125" text-anchor="middle" font-size="11" fill="#15803d">Windows</text>
    <text x="615" y="141" text-anchor="middle" font-size="11" fill="#15803d">macOS</text>
    <text x="615" y="157" text-anchor="middle" font-size="11" fill="#15803d">Linux</text>
  </g>

  <!-- Right side: frozen v1.0 frame layout (compact, vertical) -->
  <g>
    <rect x="710" y="50" width="170" height="130" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="795" y="73" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">frozen v1.0 frame</text>
    <text x="795" y="93" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#475569">0xAA</text>
    <text x="795" y="108" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#475569">seq:u16</text>
    <text x="795" y="123" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#475569">cmd:u8</text>
    <text x="795" y="138" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#475569">plen:u16</text>
    <text x="795" y="153" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#475569">payload</text>
    <text x="795" y="168" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#475569">csum:u8</text>
  </g>

  <!-- Tagline -->
  <text x="450" y="220" text-anchor="middle" font-size="12.5" fill="#475569">
    Open firmware · frozen v1.0 wire protocol · MIT-licensed · zero network call
  </text>
  <text x="450" y="240" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">
    Compatible with any RP2350 board (~$8 Raspberry Pi Pico 2). Spec: docs/protocol-v1.md.
  </text>
</svg>
